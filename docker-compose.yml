version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: finops_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin@123}
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: finops_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./API
    container_name: finops_api
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./App
    container_name: finops_frontend
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
