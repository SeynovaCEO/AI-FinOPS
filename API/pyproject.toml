[project]
name = "ai-finops-api"
version = "0.1.0"
description = "AI FinOps Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.103.2",
    "uvicorn>=0.23.2",
    "sqlalchemy>=2.0.21",
    "pydantic>=2.4.2",
    "pydantic-settings>=2.0.3",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.2",
    "black>=23.9.1",
    "ruff>=0.0.291",
    "mypy>=1.5.1",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "B", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
